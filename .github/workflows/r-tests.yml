name: R tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Install package
        run: R CMD INSTALL .
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Render reproducible analysis
        run: make report
      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-report
          path: |
            analysis/report.md
            analysis/figures/
